pluginGroup=me.pandras
pluginName=Riverpod Wrapper
pluginRepositoryUrl=https://github.com/rogeriodeandradepires/riverpod_wrapper
pluginVersion=1.1.0

# Android Studio Quail (2026.1) and IntelliJ 2026.1 are build 261.
pluginSinceBuild=261
# Intentionally empty: the plugin only uses stable APIs, so no upper bound is written to plugin.xml
# and the plugin stays installable on future IDE releases instead of breaking on every upgrade.
pluginUntilBuild=

# Android Studio Quail 2 | 2026.1.2 Patch 1 (build AI-261.25134.95.2612.15914620).
# Version numbers: https://jb.gg/android-studio-releases-list.json
platformVersion=2026.1.2.11

# Bundled with Android Studio.
platformBundledPlugins=org.jetbrains.android
# Downloaded from JetBrains Marketplace; these builds are the ones compatible with AI-261.25134.95.
platformPlugins=Dart:507.0.0,io.flutter:94.0.0

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# IntelliJ Platform Gradle Plugin 2.x requires Gradle 9.0+.
gradleVersion=9.6.1
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.code.style=official
